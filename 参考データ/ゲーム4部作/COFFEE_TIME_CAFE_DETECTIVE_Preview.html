function drawPage(){clear('page');header(pageTitle);const p=pages[pageIndex];const ch=PACK.characters.find(x=>x.id===p.speaker);const av=text('div','avatar',p.speaker==='NARRATOR'?'手帳':p.speaker);av.dataset.id=p.speaker;root.append(av);root.append(text('div','name',ch?ch.name:p.speaker));root.append(text('div','body',p.text));btn('戻る',108,373,112,49,()=>{if(pageIndex>0){pageIndex--;drawPage();}else if(pageReturn)pageReturn();},false,pageIndex===0&&!pageReturn);btn(pageIndex===pages.length-1?'つづける':'次へ',260,373,112,49,()=>{if(++pageIndex<pages.length)drawPage();else afterPages();},true);footer(`${pageIndex+1} / ${pages.length}　｜　ひとり推理・PC参考版`);}
function home(){clear('home');header('COFFEE TIME\n喫茶「余白」の小さな謎');PACK.episodes.forEach((e,i)=>btn(`第${i+1}話  ${e.public.short_title}`,86,142+i*73,308,59,()=>cover(e),i===0));if(a&&a.phase!=='resolved')btn('中断した話へ',154,370,172,49,()=>hub());footer('3話すべて収録／初めてなら第1話から');}
function cover(e){clear('cover');ep=e;header('第'+e.order+'話');root.append(text('div','body',e.public.title+'\n\n'+e.public.menu_teaser));btn('一覧',106,373,112,49,home);btn(seenCases.has(e.case_id)?'読み直す':'はじめる',258,373,116,49,()=>start(e),true);footer('回答後には全員が結末まで読めます');}
function start(e){ep=e;a=C.begin(e,{attempt_id:Array.from(crypto.getRandomValues(new Uint8Array(16)),n=>n.toString(16).padStart(2,'0')).join(''),actor_id:'PC_GUEST',device_id:'PC_PREVIEW',public_hash:'0'.repeat(64),mode:'solo',now_ms:Date.now(),practice:true});seenCases.add(ep.case_id);sequence(ep.public.short_title,[...ep.public.intro,...ep.public.premises],hub,home);}
function hub(){if(!a)return home();ep=PACK.episodes.find(e=>e.case_id===a.case_id);clear('hub');header(ep.public.short_title+'\n証拠・証言を確かめよう');ep.public.clues.forEach((c,i)=>btn((a.seen_ids.includes(c.id)?'✓ ':'')+c.label,86,125+i*65,308,55,()=>sequence(c.label,c.pages,()=>{a=C.progress(a,ep,[c.id],Date.now());hub();},hub)));btn('手帳まとめ',85,330,145,49,notebook);btn('店の様子',250,330,145,49,ambient);btn('推理する',152,392,176,49,()=>{a=C.prepare(a,ep,Date.now());choice();},true,a.seen_ids.length!==3);footer('すべての証拠を読んでから推理できます');}
function notebook(){const ps=ep.public.clues.filter(c=>a.seen_ids.includes(c.id)).map(c=>speak(c.summary.join('\n')));sequence('手帳まとめ',ps.length?ps:[speak('まだ証拠がありません。\n人物や品物をタッチしましょう。')],hub,hub);}
function ambient(){sequence('店の様子',ep.public.ambient.flatMap(x=>x.pages),hub,hub);}
function hints(){if(!a||a.phase==='resolved')return;if(a.hint_level<2)a=C.hint(a,a.hint_level+1,Date.now());const h=ep.public.hints[a.hint_level-1];sequence('ヒント '+a.hint_level,h.pages,hub,hub);}
function choice(){clear('choice');header(ep.public.question);ep.public.options.forEach((o,i)=>btn(o.label,136,142+i*68,208,55,()=>confirmChoice(o),i===0));btn('証拠へ戻る',152,371,176,49,hub);footer('人物を選んだ後、もう一度確認します');}
function confirmChoice(o){sequence('推理の確認',[speak(o.label+'で、決定しますか？\n確定した回答は変更できません。')],()=>answer(o.id),choice);const b=root.querySelectorAll('button');b[b.length-1].textContent='決定';}
function answer(id){a=C.resolve(a,ep,id,Date.now());result();}
function result(){clear('result');header('答え合わせ');const r=a.result,label=ep.public.options.find(x=>x.id===r.correct_answer).label;root.append(text('div','body',(r.gave_up?'答えを確認しましょう。':r.human_correct?'謎がつながりました！':'もう一度、手掛かりを。')+'\n\n正解：'+label+'\nひとり推理／復習'));btn('理由と物語へ',136,373,208,49,explanation,true);footer('勝敗よりも、最後の会話を楽しんでください');}
function explanation(){let pre=[];if(a.result.human_choice&&!a.result.human_correct)pre=[speak(ep.private.wrong_feedback[a.result.human_choice])];sequence('手帳の答え合わせ',[...pre,...ep.private.explanation],ending,result);}
function ending(){sequence('喫茶「余白」の、その後',ep.private.epilogue,collect,explanation);}
function collect(){clear('collect');header('手帳に残ったもの');root.append(text('div','body',ep.private.collectible.label+'\n\n'+ep.private.collectible.text));btn('作品一覧へ',136,373,208,49,()=>{a=null;home();},true);footer('この物語を読んだ記念です');}
document.getElementById('home-btn').onclick=home;
document.getElementById('coffee-btn').onclick=()=>{coffee++;toast.textContent=`コーヒー ${coffee}杯（PC内のデモ値。実際の記録は送りません）`;};
document.getElementById('hint-btn').onclick=hints;
document.getElementById('giveup-btn').onclick=()=>{if(a&&a.phase!=='resolved'){sequence('答えを確認しますか？',[speak('解説と結末へ進みます。\n途中の謎解きへは戻りません。')],()=>answer(null),hub);}};
function resize(){const s=Math.min(1,(window.innerWidth-32)/480);const h=document.getElementById('holder');h.style.width=480*s+'px';h.style.height=480*s+'px';document.getElementById('dial').style.transform=`scale(${s})`;}
window.addEventListener('resize',resize);resize();home();
window.CafePreview={pack:PACK,getState:()=>({screen:screenName,case_id:ep&&ep.case_id,phase:a&&a.phase,coffee}),start,hub,choice,answer,sequence};
</script></html>
