; COFFEE TIME firmware
; Board: Waveshare ESP32-S3-Touch-LCD-2.8C (480x480 round, ST7701 RGB + GT911)
;
;   pio run -e app -t upload      ... COFFEE TIME アプリ本体
;   pio run -e hwtest -t upload   ... LCD/タッチのハードウェア試験（カラーバー＋タッチ座標ログ）
;   pio device monitor            ... シリアルログ表示

[platformio]
default_envs = app
; Windows のパス長上限 (260 文字) を避けるため、ツール類を短いパスに置く
core_dir = C:/pio

[env]
; pioarduino = Arduino-ESP32 core 3.3.11 (ESP-IDF 5.5.5)。版数を固定して再現性を保つ
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
framework = arduino
board = esp32-s3-devkitc-1

; Flash 16MB (QIO) + OPI PSRAM 8MB
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv

monitor_speed = 115200
monitor_filters = esp32_exception_decoder

build_flags =
    -I include
    -DBOARD_HAS_PSRAM
    ; 基板の native USB 端子 (VID 303A) で接続しているため USB CDC を有効化
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DLV_CONF_INCLUDE_SIMPLE
    -DLV_LVGL_H_INCLUDE_SIMPLE

lib_deps =
    https://github.com/esp-arduino-libs/ESP32_Display_Panel.git#v1.0.4
    https://github.com/esp-arduino-libs/ESP32_IO_Expander.git#v1.1.1
    https://github.com/esp-arduino-libs/esp-lib-utils.git#v0.2.3

[env:app]
build_src_filter = +<app/>
; ビルド時の Git の版を CT_GIT_REV として埋め込む（「システム情報」の「ソフトの版」）。
; git が使えなくてもビルドは止まらない
extra_scripts = pre:../tools/git_rev.py
; アプリのソース（src/app）だけに、Serial を「シリアル ＋ Wi-Fi の遠隔コンソール」に差し替えるヘッダーを
; 先頭で読み込ませる（RemoteConsole.h）。ライブラリとほかの env には効かない。app_uart も受け継ぐ
build_src_flags = -include src/app/ct_serial_tee.h
lib_deps =
    ${env.lib_deps}
    lvgl/lvgl@8.4.0
    bblanchon/ArduinoJson@^7.4.2

; 基板の「USB TO UART」側 (CH343) の端子につないだとき用。ログ・スクショはその COM ポートで読める
[env:app_uart]
extends = env:app
build_unflags =
    -DARDUINO_USB_CDC_ON_BOOT=1
build_flags =
    ${env.build_flags}
    -UARDUINO_USB_CDC_ON_BOOT
    -DARDUINO_USB_CDC_ON_BOOT=0

; Wi-Fi 受信の切り分け用（画面なしでスキャンのみ）
[env:wifitest]
build_src_filter = +<wifitest/>

; microSD の動作試験（画面を初期化した後に SD を読み書きできるか）
[env:sdtest]
build_src_filter = +<sdtest/>

[env:hwtest]
build_src_filter = +<hwtest/>
